<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock_Paper_scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rock Paper Scissor</h1>
    <div class="choices">
        <div class="choice">
            <button class='img' id="Rock">✊</button>
            <button class='img' id="Paper">🖐️</button>
            <button class='img' id="Scissor">✌️</button>
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <div id="user">0</div>
            <div>You</div>
        </div>
        <div class="score">
            <div id="com">0</div>
            <div>Computer</div>
        </div>
    </div>
    <!-- <div class="win-msg">
        <div id="ma1">"You won against computer!!!</div>
        <div id="ma2">"Computer won against you!!!</div>
        <div id="ma3">The match is draw!!!</div>
    </div> -->
    <div class="msg-container">
        <p id="msg">Play your move!!!</p>
    </div>


    <script src="script.js"></script>
</body>

</html>
